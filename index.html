  const foot = `${existing ? `<button type="button" class="btn btn-danger del" data-del aria-label="Delete item">${icon('trash')}</button>` : ''}<button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="button" class="btn btn-primary" data-save>${existing ? 'Save changes' : 'Add item'}</button>`;
  openSheet({
    title: existing ? 'Edit item' : (defaults.status === 'Idea' ? 'Add idea' : 'Add new item'), body, foot,
    onMount: ({ el, close }) => {
      const form = $('form', el);
      bindCategory(el); bindUpload(el, holder); formatMoneyInputs(el);
      const calc = () => {
        const fd = new FormData(form);
        const est = num(fd.get('estimated')), fin = num(fd.get('final')), paid = num(fd.get('paid')), status = fd.get('status');
        const cost = fin > 0 ? fin : est, inB = IN_BUDGET_STATUSES.includes(status);
        const oldCost = existing && Calc.inBudget(existing) ? Calc.cost(existing) : 0;
        const delta = (inB ? cost : 0) - oldCost;
        $('[data-payextra]', el).style.display = paid !== paidNow ? '' : 'none';
        $('[data-calc]', el).innerHTML = `<div><span>Balance</span><b>${money(cost - paid)}</b></div><div><span>${inB ? 'Counted in budget' : 'Not in budget'}</span><b>${inB ? money(cost) : '₹0'}</b></div><div><span>Budget total changes by</span><b style="color:${delta > 0 ? 'var(--danger)' : delta < 0 ? 'var(--ok)' : 'inherit'}">${delta ? signed(delta) : '₹0'}</b></div>`;
      };
      form.addEventListener('input', calc); form.addEventListener('change', calc); calc();
      form.addEventListener('submit', e => { e.preventDefault(); $('[data-save]', el).click(); });
      if (existing) $('[data-del]', el).onclick = () => { close(); actDeleteItem(existing.id); };
      $('[data-save]', el).onclick = () => {
        if (holder.uploading) { toast('Wait for the photo to finish saving.'); return; }
        const fd = new FormData(form);
        const name = String(fd.get('name') || '').trim();
        if (!name) return fieldError(form, 'name', 'Give this item a name.');
        const category = readCategory(form);
        if (!category) return fieldError(form, 'newCategory', 'Type a name for the new category.');
        const snap = snapshot(['items', 'payments', 'settings']);
        const before = S.projected;
        const item = existing || { id: uid('it'), createdAt: Date.now() };
        Object.assign(item, { name, category, group: String(fd.get('group') || '').trim(), image: holder.image, estimated: Math.max(0, num(fd.get('estimated'))), final: Math.max(0, num(fd.get('final'))), vendorId: fd.get('vendorId') || '', status: fd.get('status') || 'Selected', notes: String(fd.get('notes') || '').trim(), updatedAt: Date.now() });
        if (!existing) state.items.push(item);
        const replaced = Calc.inBudget(item) ? groupmates(item) : [];
        replaced.forEach(o => { o.status = 'Shortlisted'; o.updatedAt = Date.now(); });
        const diff = num(fd.get('paid')) - paidNow;
        if (diff !== 0) state.payments.push({ id: uid('p'), itemId: item.id, amount: diff, date: fd.get('payDate') || localISO(), method: fd.get('payMethod') || 'Other', notes: diff < 0 ? 'Correction from item form' : 'Recorded from item form', createdAt: Date.now() });
        close();
        commit(['items', 'payments', 'settings']);
        const delta = S.projected - before;
        toast(`${existing ? 'Saved' : 'Added'} ${name}.${replaced.length ? ` Replaced ${replaced.map(r => r.name).join(', ')}.` : ''} Budget ${delta ? signed(delta) : 'unchanged'}.`, { undo: () => restore(snap) });
      };
    }
  });
}

async function exportBackup() {

  for (const r of refs) {

    else if (r.startsWith('asset:')) { const j = await Images.asJpeg(r, 1600); if (j) images[r] = j.data; }

  await Downloads.save(`wedding-planner-${PROFILE ? PROFILE.id + '-' : ''}backup-${localISO()}.json`, data, 'application/json');
}

  const map = {};
  for (const [ref, data] of Object.entries(backup.images || {})) {
    try { map[ref] = await Images.put(new File([dataUrlToBlob(data)], 'photo.jpg', { type: 'image/jpeg' })); } catch (err) { /* keep going without this photo */ }
  }
  [...s.items, ...s.vendors].forEach(x => { if (x.image && map[x.image]) x.image = map[x.image]; });
  s.people.forEach(x => { if (x.photo && map[x.photo]) x.photo = map[x.photo]; });
  if (map[s.settings.photo]) s.settings.photo = map[s.settings.photo];
  if (map[s.settings.wedding.invite]) s.settings.wedding.invite = map[s.settings.wedding.invite];
  replaceState(s);
  toast('Backup restored.');
});

/* ---------- L. PDF GENERATION ----------
   Uses jsPDF (loaded from cdnjs) to draw A4 reports directly: no screenshots,
   so text stays sharp and files stay small. Standard PDF fonts can't draw the
   rupee sign, so amounts print as "Rs. 1,00,000".                            */
const PDF = {
  C: { ink: [29, 38, 33], muted: [98, 110, 103], faint: [150, 160, 154], line: [222, 227, 221], primary: [31, 92, 73], brass: [164, 123, 52], brassSoft: [246, 239, 224], soft: [244, 246, 243], ok: [46, 122, 84], okSoft: [225, 241, 231], danger: [176, 68, 58], dangerSoft: [250, 232, 229], white: [255, 255, 255] },
  t(s) { return String(s ?? '').replace(/₹/g, 'Rs. ').replace(/[−–]/g, '-').replace(/—/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/…/g, '...').replace(/×/g, 'x').replace(/[^\x00-\xFF]/g, ''); },
  rs(n) { const v = Math.round(n || 0); return (v < 0 ? '-' : '') + 'Rs. ' + INR.format(Math.abs(v)); },
  create(title, subtitle) {
    if (!window.jspdf || !window.jspdf.jsPDF) throw Object.assign(new Error('The PDF tool didn’t load. Check your internet connection and reload the page.'), { user: true });
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
    doc.setProperties({ title: this.t(title), creator: 'Wedding Budget Planner' });
    const ctx = { doc, W: 210, H: 297, M: 16, y: 0, title };
    this.header(ctx, title, subtitle);
    return ctx;
  },
  header(ctx, title, subtitle) {
    const { doc, W, M } = ctx, C = this.C;
    doc.setFillColor(...C.primary); doc.rect(0, 0, W, 4, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...C.brass);
    doc.text(this.t('WEDDING BUDGET PLANNER' + (PROFILE ? '  |  ' + PROFILE.planner.toUpperCase() : '')), M, 16, { charSpace: 0.5 });
    doc.setFont('helvetica', 'normal'); doc.setTextColor(...C.muted);
    doc.text(this.t('Generated ' + new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })), W - M, 16, { align: 'right' });
    doc.setFont('times', 'bold'); doc.setFontSize(22); doc.setTextColor(...C.ink);
    doc.text(this.t(title), M, 29);
    let y = 29;
    if (subtitle) { doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...C.muted); const lines = doc.splitTextToSize(this.t(subtitle), W - 2 * M); doc.text(lines, M, 36.5); y = 36.5 + (lines.length - 1) * 4.6; }
    doc.setDrawColor(...C.brass); doc.setLineWidth(0.5); doc.line(M, y + 5, W - M, y + 5);
    ctx.y = y + 13;
  },
  ensure(ctx, h) {
    if (ctx.y + h <= ctx.H - 20) return false;
    const { doc, W, M } = ctx;
    doc.addPage();
    doc.setFillColor(...this.C.primary); doc.rect(0, 0, W, 2, 'F');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...this.C.faint); doc.text(this.t(ctx.title), M, 12);
    ctx.y = 20;
    return true;
  },
  section(ctx, text) {
    this.ensure(ctx, 42); // keep a heading together with the start of its content
    const { doc, M, W } = ctx;
    ctx.y += 3;
    doc.setFont('times', 'bold'); doc.setFontSize(14); doc.setTextColor(...this.C.primary); doc.text(this.t(text), M, ctx.y);
    ctx.y += 2.5; doc.setDrawColor(...this.C.line); doc.setLineWidth(0.3); doc.line(M, ctx.y, W - M, ctx.y);
    ctx.y += 6;
  },
  boxes(ctx, list, cols = 3) {
    const { doc, M, W } = ctx, C = this.C, gap = 4, bh = 19;
    const bw = (W - 2 * M - gap * (cols - 1)) / cols, rows = Math.ceil(list.length / cols);
    this.ensure(ctx, rows * (bh + gap));
    list.forEach((b, i) => {
      const x = M + (i % cols) * (bw + gap), y = ctx.y + Math.floor(i / cols) * (bh + gap);
      const fill = { primary: C.primary, danger: C.dangerSoft, ok: C.okSoft }[b.tone] || C.soft;
      doc.setFillColor(...fill); doc.roundedRect(x, y, bw, bh, 2.5, 2.5, 'F');
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...(b.tone === 'primary' ? [196, 220, 208] : C.muted)); doc.text(this.t(b.label), x + 4, y + 6.5);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(...(b.tone === 'primary' ? C.white : b.tone === 'danger' ? C.danger : b.tone === 'ok' ? C.ok : C.ink));
      doc.text(this.t(b.value), x + 4, y + 14.5);
    });
    ctx.y += rows * (bh + gap) + 2;
  },
  kv(ctx, rows) {
    const { doc, M, W } = ctx;
    rows.forEach(([k, v, bold]) => {
      doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(10);
      const lines = doc.splitTextToSize(this.t(v || '-'), W - 2 * M - 50);
      const h = Math.max(8, lines.length * 4.6 + 3.4);
      this.ensure(ctx, h);
      doc.setFont('helvetica', 'normal'); doc.setTextColor(...this.C.muted); doc.text(this.t(k), M, ctx.y + 5.4);
      doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setTextColor(...this.C.ink); doc.text(lines, M + 50, ctx.y + 5.4);
      ctx.y += h; doc.setDrawColor(...this.C.line); doc.setLineWidth(0.2); doc.line(M, ctx.y, W - M, ctx.y);
    });
    ctx.y += 5;
  },
  para(ctx, text, { size = 10, color } = {}) {
    const { doc, M, W } = ctx;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(size); doc.setTextColor(...(color || this.C.ink));
    doc.splitTextToSize(this.t(text), W - 2 * M).forEach(l => { this.ensure(ctx, 5.5); doc.text(l, M, ctx.y + 4); ctx.y += size * 0.5; });
    ctx.y += 4;
  },
  table(ctx, cols, rows, { total = null, empty = 'Nothing to show.' } = {}) {
    const { doc, M, W } = ctx, C = this.C, tw = W - 2 * M;
    const widths = cols.map(c => c.w * tw);
    const head = () => {
      doc.setFillColor(...C.primary); doc.rect(M, ctx.y, tw, 8, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...C.white);
      let x = M; cols.forEach((c, i) => { doc.text(this.t(c.h), c.r ? x + widths[i] - 2.5 : x + 2.5, ctx.y + 5.4, { align: c.r ? 'right' : 'left' }); x += widths[i]; });
      ctx.y += 8;
    };
    this.ensure(ctx, 18); head();
    if (!rows.length) { doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(...C.muted); doc.text(this.t(empty), M + 2.5, ctx.y + 6); ctx.y += 12; return; }
    const all = total ? [...rows, total] : rows;
    all.forEach((row, ri) => {
      const isTotal = !!total && ri === all.length - 1;
      doc.setFont('helvetica', isTotal ? 'bold' : 'normal'); doc.setFontSize(9);
      const cells = row.map((v, i) => cols[i].r ? [this.t(v)] : doc.splitTextToSize(this.t(v), widths[i] - 5));
      const h = Math.max(7.5, Math.max(...cells.map(c => c.length)) * 4 + 3.5);
      if (this.ensure(ctx, h)) head();
      if (isTotal) { doc.setFillColor(...C.brassSoft); doc.rect(M, ctx.y, tw, h, 'F'); }
      else if (ri % 2 === 1) { doc.setFillColor(...C.soft); doc.rect(M, ctx.y, tw, h, 'F'); }
      doc.setFont('helvetica', isTotal ? 'bold' : 'normal'); doc.setFontSize(9); doc.setTextColor(...C.ink);
      let x = M; cells.forEach((lines, i) => { doc.text(lines, cols[i].r ? x + widths[i] - 2.5 : x + 2.5, ctx.y + 5, { align: cols[i].r ? 'right' : 'left' }); x += widths[i]; });
      ctx.y += h;
    });
    doc.setDrawColor(...C.line); doc.setLineWidth(0.3); doc.line(M, ctx.y, W - M, ctx.y);
    ctx.y += 7;
  },
  async image(ctx, ref, maxH = 95) {
    const j = await Images.asJpeg(ref, 1400); if (!j) return false;
    const { doc, M, W } = ctx, maxW = W - 2 * M;
    let w = maxW, h = w * j.h / j.w;
    if (h > maxH) { h = maxH; w = h * j.w / j.h; }
    this.ensure(ctx, h + 6);
    doc.setFillColor(...this.C.soft); doc.roundedRect(M, ctx.y, maxW, h, 2, 2, 'F');
    doc.addImage(j.data, 'JPEG', M + (maxW - w) / 2, ctx.y, w, h);
    ctx.y += h + 7;
    return true;
  },
  finish(ctx, filename) {
    const { doc, W, H, M } = ctx, n = doc.getNumberOfPages();
    for (let p = 1; p <= n; p++) {
      doc.setPage(p);
      doc.setDrawColor(...this.C.line); doc.setLineWidth(0.3); doc.line(M, H - 13, W - M, H - 13);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...this.C.faint);
      doc.text('Wedding Budget Planner  |  Private planning document', M, H - 8);
      doc.text(`Page ${p} of ${n}`, W - M, H - 8, { align: 'right' });
    }
    const blob = doc.output('blob');
    return { blob, name: filename, pages: n, size: blob.size };
  }
};

async function buildItemPdf(id) {
  const i = itemById(id); if (!i) throw Object.assign(new Error('Choose an item first.'), { user: true });
  const pm = Calc.paidMap(), c = Calc.cost(i), p = pm[i.id] || 0, v = vendorById(i.vendorId);
  const ctx = PDF.create('WEDDING EXPENSE / QUOTATION', `${i.category}: ${i.name}`);
  PDF.kv(ctx, [['Category', i.category], ['Item', i.name, true], ['Status', `${i.status} (${Calc.inBudget(i) ? 'included in budget' : 'not included in budget'})`], ['Vendor', v ? [v.name, v.phone].filter(Boolean).join(', ') : '-'], ...(i.group ? [['Option group', i.group]] : [])]);
  if (i.image) { PDF.section(ctx, 'Image'); await PDF.image(ctx, i.image, 100); }
  PDF.section(ctx, 'Price summary');
  PDF.boxes(ctx, [
    { label: 'Estimated price', value: PDF.rs(i.estimated) },
    { label: 'Final price', value: num(i.final) ? PDF.rs(i.final) : 'Not agreed yet' },
    { label: 'Amount paid', value: PDF.rs(p), tone: 'ok' },
    { label: 'Balance', value: PDF.rs(c - p), tone: c - p > 0 ? 'primary' : c - p < 0 ? 'danger' : 'ok' }
  ], 2);
  if (num(i.final) && num(i.estimated) > num(i.final)) PDF.para(ctx, `Saved ${PDF.rs(num(i.estimated) - num(i.final))} against the estimated price.`, { color: PDF.C.ok });
  PDF.section(ctx, 'Notes'); PDF.para(ctx, i.notes || 'No notes.');
  const pays = state.payments.filter(x => x.itemId === i.id).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  PDF.section(ctx, 'Payments');
  PDF.table(ctx, [{ h: 'Date', w: .2 }, { h: 'Method', w: .2 }, { h: 'Notes', w: .38 }, { h: 'Amount', w: .22, r: true }], pays.map(x => [fmtDate(x.date), x.method, x.notes || '', PDF.rs(x.amount)]), { total: pays.length ? ['Total paid', '', '', PDF.rs(p)] : null, empty: 'No payments recorded yet.' });
  return PDF.finish(ctx, `quotation-${slug(i.name)}.pdf`);
}

async function buildVendorPdf(id) {

  const ctx = PDF.create('VENDOR DETAILS', `${v.name}, ${v.category || 'No category'}`);
  PDF.kv(ctx, [['Vendor', v.name, true], ['Category', v.category], ['Status', v.status], ['Contact number', v.phone], ['Email', v.email], ['Instagram / Website', v.link]]);
  PDF.section(ctx, 'Quotation and payments');
  PDF.boxes(ctx, [
    { label: 'Quoted price', value: num(v.quoted) ? PDF.rs(v.quoted) : '-' },
    { label: 'Final price', value: num(v.final) ? PDF.rs(v.final) : 'Not agreed yet' },
    { label: 'Advance paid', value: PDF.rs(paid), tone: 'ok' },
    { label: 'Balance', value: PDF.rs(price - paid), tone: price - paid > 0 ? 'primary' : price - paid < 0 ? 'danger' : 'ok' }
  ], 2);
  if (num(v.quoted) > num(v.final) && num(v.final)) PDF.para(ctx, `Negotiated ${PDF.rs(num(v.quoted) - num(v.final))} below the quoted price.`, { color: PDF.C.ok });
  const linked = state.items.filter(i => i.vendorId === v.id);
  PDF.section(ctx, 'Budget items');
  PDF.table(ctx, [{ h: 'Item', w: .36 }, { h: 'Status', w: .16 }, { h: 'Price', w: .16, r: true }, { h: 'Paid', w: .16, r: true }, { h: 'Balance', w: .16, r: true }], linked.map(i => [i.name, i.status, PDF.rs(Calc.cost(i)), PDF.rs(pm[i.id] || 0), PDF.rs(Calc.cost(i) - (pm[i.id] || 0))]), { empty: 'This vendor is not linked to a budget item yet.' });
  const pays = state.payments.filter(p => linked.some(i => i.id === p.itemId)).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  if (pays.length) { PDF.section(ctx, 'Payment history'); PDF.table(ctx, [{ h: 'Date', w: .18 }, { h: 'Item', w: .3 }, { h: 'Method', w: .17 }, { h: 'Notes', w: .17 }, { h: 'Amount', w: .18, r: true }], pays.map(p => [fmtDate(p.date), (itemById(p.itemId) || {}).name || '', p.method, p.notes || '', PDF.rs(p.amount)]), { total: ['Total paid', '', '', '', PDF.rs(paid)] }); }
  PDF.section(ctx, 'Notes'); PDF.para(ctx, v.notes || 'No notes.');
  if (v.image) { PDF.section(ctx, 'Quotation / image'); await PDF.image(ctx, v.image, 150); }
  return PDF.finish(ctx, `vendor-${slug(v.name)}.pdf`);
}

async function buildReportPdf() {
  const s = Calc.summary(), lvl = Calc.budgetLevel(s), pm = s.pm;
  const dateText = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
  const ctx = PDF.create('WEDDING BUDGET REPORT', `Budget, expenses, payments and tasks as of ${dateText}`);
  PDF.boxes(ctx, [
    { label: 'Total wedding budget', value: PDF.rs(s.budget), tone: 'primary' },
    { label: 'Total estimated cost', value: PDF.rs(s.estimated) },
    { label: 'Total final cost (agreed)', value: PDF.rs(s.final) },
    { label: 'Current cost (final or estimate)', value: PDF.rs(s.projected), tone: lvl === 'over' ? 'danger' : '' },
    { label: 'Total paid', value: PDF.rs(s.paid), tone: 'ok' },
    { label: 'Total balance to pay', value: PDF.rs(s.outstanding) }
  ], 3);
  PDF.para(ctx, lvl === 'none' ? 'No total budget has been set.' : lvl === 'over' ? `${PDF.rs(-s.headroom)} over budget.` : `${PDF.rs(s.headroom)} budget remaining after current costs.`, { size: 12, color: lvl === 'over' ? PDF.C.danger : PDF.C.ok });
  PDF.para(ctx, `Remaining budget after payments: ${PDF.rs(s.remainingBudget)}. Expected remaining cost: ${PDF.rs(s.expectedRemaining)}. ${s.itemCount} items in budget.`, { size: 9.5, color: PDF.C.muted });

  PDF.section(ctx, 'Category-wise expenses');
  const ct = s.byCategory.reduce((a, c) => ({ e: a.e + c.estimated, f: a.f + c.final, c: a.c + c.projected, p: a.p + c.paid, b: a.b + c.balance }), { e: 0, f: 0, c: 0, p: 0, b: 0 });
  PDF.table(ctx, [{ h: 'Category', w: .26 }, { h: 'Estimated', w: .15, r: true }, { h: 'Final', w: .15, r: true }, { h: 'Current cost', w: .16, r: true }, { h: 'Paid', w: .14, r: true }, { h: 'Balance', w: .14, r: true }],
    s.byCategory.map(c => [c.category, PDF.rs(c.estimated), c.final ? PDF.rs(c.final) : '-', PDF.rs(c.projected), PDF.rs(c.paid), PDF.rs(c.balance)]),
    { total: s.byCategory.length ? ['TOTAL', PDF.rs(ct.e), PDF.rs(ct.f), PDF.rs(ct.c), PDF.rs(ct.p), PDF.rs(ct.b)] : null, empty: 'No items in the budget yet.' });

  const sel = state.items.filter(Calc.inBudget).sort((a, b) => catOrder(a.category) - catOrder(b.category) || Calc.cost(b) - Calc.cost(a));
  PDF.section(ctx, 'Selected items');
  PDF.table(ctx, [{ h: 'Item', w: .31 }, { h: 'Category', w: .2 }, { h: 'Status', w: .13 }, { h: 'Cost', w: .12, r: true }, { h: 'Paid', w: .12, r: true }, { h: 'Balance', w: .12, r: true }],
    sel.map(i => [i.name, i.category, i.status, PDF.rs(Calc.cost(i)), PDF.rs(pm[i.id] || 0), PDF.rs(Calc.cost(i) - (pm[i.id] || 0))]),
    { total: sel.length ? ['TOTAL', '', '', PDF.rs(s.projected), PDF.rs(s.paid), PDF.rs(s.projected - s.paid)] : null, empty: 'No items selected yet.' });

  const pending = sel.filter(i => Calc.cost(i) - (pm[i.id] || 0) > 0).sort((a, b) => (Calc.cost(b) - (pm[b.id] || 0)) - (Calc.cost(a) - (pm[a.id] || 0)));
  PDF.section(ctx, 'Pending payments');
  PDF.table(ctx, [{ h: 'Item', w: .32 }, { h: 'Vendor', w: .26 }, { h: 'Price', w: .14, r: true }, { h: 'Paid', w: .14, r: true }, { h: 'Balance', w: .14, r: true }],
    pending.map(i => [i.name, (vendorById(i.vendorId) || {}).name || '-', PDF.rs(Calc.cost(i)), PDF.rs(pm[i.id] || 0), PDF.rs(Calc.cost(i) - (pm[i.id] || 0))]),
    { total: pending.length ? ['TOTAL OUTSTANDING', '', '', '', PDF.rs(s.outstanding)] : null, empty: 'Everything is paid.' });

  if (state.vendors.length) {
    PDF.section(ctx, 'Vendors');
    PDF.table(ctx, [{ h: 'Vendor', w: .26 }, { h: 'Category', w: .2 }, { h: 'Status', w: .14 }, { h: 'Final price', w: .14, r: true }, { h: 'Paid', w: .13, r: true }, { h: 'Balance', w: .13, r: true }],
      state.vendors.map(v => { const price = num(v.final) || num(v.quoted), paid = Calc.vendorPaid(v.id, pm); return [v.name, v.category, v.status, price ? PDF.rs(price) : '-', PDF.rs(paid), PDF.rs(price - paid)]; }));
  }

  PDF.section(ctx, 'Potential savings');
  PDF.table(ctx, [{ h: 'Option', w: .28 }, { h: 'Current', w: .15, r: true }, { h: 'Alternative', w: .15, r: true }, { h: 'Saving', w: .15, r: true }, { h: 'Notes', w: .27 }],
    state.savings.map(x => { const cur = Calc.savingCurrent(x); return [x.label, PDF.rs(cur), PDF.rs(x.alternative), PDF.rs(cur - num(x.alternative)), x.notes || '']; }),
    { total: state.savings.length ? ['POTENTIAL TOTAL SAVINGS', '', '', PDF.rs(s.savings), ''] : null, empty: 'No savings suggestions added.' });

  PDF.section(ctx, 'Tasks');
  PDF.boxes(ctx, [{ label: 'Completed tasks', value: String(s.tasksDone), tone: 'ok' }, { label: 'Pending tasks', value: String(s.tasksPending) }, { label: 'Overdue', value: String(s.overdue.length), tone: s.overdue.length ? 'danger' : '' }], 3);
  const pendingTasks = state.tasks.filter(t => !t.done).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
  PDF.table(ctx, [{ h: 'Pending task', w: .46 }, { h: 'Group', w: .18 }, { h: 'Due', w: .18 }, { h: 'Status', w: .18 }],
    pendingTasks.map(t => [t.title, t.group, t.due ? fmtDate(t.due) : '-', t.due && daysFromToday(t.due) < 0 ? 'Overdue' : 'Pending']), { empty: 'All tasks are complete.' });
  return PDF.finish(ctx, `wedding-budget-report-${PROFILE ? PROFILE.id + '-' : ''}${localISO()}.pdf`);
}

let pdfBusy = false;
async function pdfRun(kind, download, id) {
  if (pdfBusy) { toast('A PDF is already being prepared.'); return; }
  const r = ui.reports;
  if (kind === 'item' && id) r.itemId = id;
  if (kind === 'vendor' && id) r.vendorId = id;
  const sel = kind === 'item' ? r.itemId : kind === 'vendor' ? r.vendorId : 'all';
  pdfBusy = true;
  try {
    let out = r.ready[kind];
    if (!out || out.sel !== sel || out.ver !== dataVersion) {
      if (kind !== 'report' && !sel) throw Object.assign(new Error(kind === 'item' ? 'Add an item first.' : 'Add a vendor first.'), { user: true });
      out = kind === 'item' ? await buildItemPdf(sel) : kind === 'vendor' ? await buildVendorPdf(sel) : await buildReportPdf();
      out.sel = sel; out.ver = dataVersion; r.ready[kind] = out;
    }
    if (route() === 'reports') render();
    if (download) await Downloads.save(out.name, out.blob, 'application/pdf');
    else toast(`PDF ready: ${out.name}`);
  } catch (e) {
    console.error(e);
    toast(e && e.user ? e.message : 'Couldn’t create the PDF. Try again.', { error: true });
  } finally { pdfBusy = false; }
}

/* ---------- M. LOGIN (bride / groom) ----------
   Each person has a separate planner and a password. The password is never stored,
   only a salted SHA-256 hash of it. This keeps the two planners apart on a shared
   device; it is a privacy lock in the browser, not server-grade security.        */
function sha256(text) {
  const bytes = new TextEncoder().encode(text);
  const K = [], H = [];
  for (let n = 2, found = 0; found < 64; n++) {
    let prime = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
    if (!prime) continue;
    if (found < 8) H[found] = (Math.pow(n, 1 / 2) % 1) * 4294967296 | 0;
    K[found++] = (Math.pow(n, 1 / 3) % 1) * 4294967296 | 0;
  }
  const len = bytes.length, buf = new Uint8Array(((len + 9 + 63) >> 6) << 6);
  buf.set(bytes); buf[len] = 0x80;
  const dv = new DataView(buf.buffer), bits = len * 8;
  dv.setUint32(buf.length - 8, Math.floor(bits / 4294967296)); dv.setUint32(buf.length - 4, bits >>> 0);
  const W = new Int32Array(64), rot = (x, r) => (x >>> r) | (x << (32 - r));
  for (let i = 0; i < buf.length; i += 64) {
    for (let t = 0; t < 16; t++) W[t] = dv.getInt32(i + t * 4);
    for (let t = 16; t < 64; t++) {
      const a = W[t - 15], b = W[t - 2];
      W[t] = (W[t - 16] + (rot(a, 7) ^ rot(a, 18) ^ (a >>> 3)) + W[t - 7] + (rot(b, 17) ^ rot(b, 19) ^ (b >>> 10))) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let t = 0; t < 64; t++) {
      const t1 = (h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + W[t]) | 0;
      const t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, k) => { H[k] = (H[k] + v) | 0; });
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
function hashPassword(password, salt) { let h = salt + ':' + password; for (let i = 0; i < 2000; i++) h = sha256(h + ':' + salt); return h; }

/* Browser-only login (used when no database is configured). */
const Auth = {
  key: role => 'wbp.auth.' + role,
  local(role) { try { return JSON.parse(localStorage.getItem(this.key(role)) || 'null'); } catch (e) { return null; } },
  async get(role) {
    const mine = this.local(role); if (mine) return mine;
    const db = await capability('db');
    if (db) { try { const snap = await db.doc('auth/' + role).get(); if (snap.exists) { const rec = snap.data(); try { localStorage.setItem(this.key(role), JSON.stringify(rec)); } catch (e) {} return rec; } } catch (e) {} }
    return null;
  },
  async put(role, rec) {
    try { localStorage.setItem(this.key(role), JSON.stringify(rec)); } catch (e) {}
    const db = await capability('db'); if (db) { try { await db.doc('auth/' + role).set(rec); } catch (e) {} }
  },
  async create(role, name, password) { const salt = uid('s'); const rec = { name: name.trim(), salt, hash: hashPassword(password, salt), createdAt: Date.now() }; await this.put(role, rec); return rec; },
  check(rec, password) { return !!rec && hashPassword(password, rec.salt) === rec.hash; }
};
const Session = {
  get() { let r = null; try { r = sessionStorage.getItem('wbp.session') || localStorage.getItem('wbp.session'); } catch (e) {} return PROFILES[r] ? r : null; },
  set(role, remember) { try { sessionStorage.setItem('wbp.session', role); if (remember) localStorage.setItem('wbp.session', role); else localStorage.removeItem('wbp.session'); } catch (e) {} },
  clear() { try { sessionStorage.removeItem('wbp.session'); localStorage.removeItem('wbp.session'); } catch (e) {} }
};

/* Database login (Supabase Auth). Email + password; the role and name live in
   the "profiles" table, and the database only returns the logged-in person's rows. */
const DbAuth = {
  get sb() { return DbStore.sb; },
  async roles() {
    const { data, error } = await this.sb.rpc('wedding_roles');
    if (error) throw error;
    const out = {}; (data || []).forEach(r => { if (PROFILES[r.role]) out[r.role] = { name: r.name || '' }; });
    return out;
  },
  async profile() {
    const { data, error } = await this.sb.from('profiles').select('role,name').maybeSingle();
    if (error) throw error;
    return data;
  },
  redirect() { return location.origin + location.pathname; },
  nice(e) {
    const m = String(e && (e.message || e.error_description) || e || '');
    if (/invalid login credentials/i.test(m)) return 'Wrong email or password. Try again.';
    if (/email not confirmed/i.test(m)) return 'Confirm your email first: open the link we sent you, then log in.';
    if (/already registered|already exists/i.test(m)) return 'This email already has an account. Log in instead.';
    if (/database error saving new user/i.test(m)) return 'This role already has an account. Log in instead.';
    if (/password should be at least/i.test(m)) return 'Use at least 6 characters for your password.';
    if (/rate limit|too many/i.test(m)) return 'Too many attempts. Wait a minute and try again.';
    if (/wedding_roles|relation .* does not exist|schema cache/i.test(m)) return 'The database isn’t set up yet. Run supabase-setup.sql in Supabase (see README).';
    if (/failed to fetch|network/i.test(m)) return 'Can’t reach the database. Check your internet connection.';
    return m || 'Something went wrong. Try again.';
  }
};

const initial = p => esc(((p.name || p.label || '?').trim().charAt(0) || '?').toUpperCase());
const avatar = p => p.photo ? `<span class="av" aria-hidden="true"><img src="${esc(p.photo)}" alt=""></span>` : `<span class="av" aria-hidden="true">${initial(p)}</span>`;

const Login = {
  recs: {}, role: null, note: '',
  async show(note = '') {
    $('#app').hidden = true; $('#bottomNav').hidden = true; $('#login').hidden = false;
    document.title = 'Log in | Wedding Budget Planner';
    this.note = note;
    if (USE_DB) {
      this.recs = {};
      if (!DbStore.sb) { this.pick(); return; }
      this.pick(true);
      try { this.recs = await DbAuth.roles(); this.loadErr = ''; } catch (e) { this.loadErr = DbAuth.nice(e); }
      if (!this.role) this.pick();
      return;
    }
    this.recs = { bride: Auth.local('bride'), groom: Auth.local('groom') };
    this.pick();
    const [b, g] = await Promise.all([Auth.get('bride'), Auth.get('groom')]);
    if ((!!b !== !!this.recs.bride) || (!!g !== !!this.recs.groom)) { this.recs = { bride: b, groom: g }; if (!this.role) this.pick(); }
  },
  frame(inner) {
    $('#login').innerHTML = `<div class="login-box"><div class="login-head"><div class="rings">${ringsBig}</div><h1>Wedding Budget Planner</h1><p>Plan Smart. Track Every Expense. Stay Within Your Budget.</p></div>${inner}<p class="login-note">Each of you has a separate, private planner. Only the person who logs in sees their own details.${USE_DB ? ' Saved securely in your database.' : ''}</p></div>`;
  },
  pick(loading = false) {
    this.role = null;
    const card = role => { const p = PROFILES[role], r = this.recs[role]; return `<button type="button" class="who" data-role="${role}">${avatar({ ...p, name: r && r.name, photo: r && r.photo })}<b>${p.label}</b><small>${loading ? 'Loading…' : r ? (r.name ? esc(r.name) : 'Log in') : 'Set up your planner'}</small></button>`; };
    const msg = this.loadErr && !loading ? `<div class="login-err" style="margin-bottom:12px">${esc(this.loadErr)}</div>` : this.note ? `<div class="inline-note" style="margin-bottom:12px">${esc(this.note)}</div>` : '';
    const demo = DEMO && !USE_DB ? `<div class="inline-note" style="margin-bottom:14px;text-align:center">Demo: bride password <b>${DEMO_PASSWORDS.bride}</b> · groom password <b>${DEMO_PASSWORDS.groom}</b></div>` : '';
    this.frame(`${msg}${demo}<p class="muted" style="text-align:center;margin-bottom:12px;font-weight:650">Who’s logging in?</p><div class="who-grid">${card('bride')}${card('groom')}</div>`);
    $$('#login .who').forEach(b => b.onclick = () => this.form(b.dataset.role));
  },
  form(role, forceMode) {
    this.role = role; this.note = '';
    const p = PROFILES[role], rec = this.recs[role];
    const isNew = forceMode ? forceMode === 'new' : !rec;
    const pw = (id, label, ac) => `<div class="field"><label for="${id}">${label}</label><div class="pw"><input class="input" id="${id}" type="password" autocomplete="${ac}" required><button type="button" data-peek="${id}">Show</button></div></div>`;
    const name = rec && rec.name;
    this.frame(`<button type="button" class="back-link" id="lgBack">‹ Not ${p.label.toLowerCase()}? Go back</button>
      <form class="login-card" data-role="${role}" id="lgForm" novalidate>
        <div class="top">${avatar({ ...p, name, photo: rec && rec.photo })}<div><h2>${isNew ? 'Set up the ' + p.label.toLowerCase() + '’s planner' : 'Welcome back' + (name ? ', ' + esc(name) : '')}</h2><p>${isNew ? 'Choose a password only you know.' : p.planner}</p></div></div>
        <div class="form-grid">
          ${isNew ? `<div class="field"><label for="lgName">Your name</label><input class="input" id="lgName" autocomplete="given-name" placeholder="${role === 'bride' ? 'e.g. Aksa Saji' : 'e.g. Ayvon Joseph'}"></div>` : ''}
          ${USE_DB ? `<div class="field"><label for="lgEmail">Email</label><input class="input" id="lgEmail" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required></div>` : ''}
          ${pw('lgPw', isNew ? 'Create password' : 'Password', isNew ? 'new-password' : 'current-password')}
          ${isNew ? pw('lgPw2', 'Confirm password', 'new-password') : ''}
          ${DEMO && !USE_DB && !isNew ? `<span class="hint">Demo password: <b>${DEMO_PASSWORDS[role]}</b></span>` : ''}
          ${USE_DB ? '' : '<label class="remember"><input type="checkbox" id="lgRemember"> Keep me logged in on this device</label>'}
          <div class="login-err" id="lgErr" role="alert" hidden></div>
          <div class="inline-note" id="lgMsg" role="status" hidden></div>
          <button type="submit" class="btn btn-primary btn-block" id="lgSubmit">${isNew ? 'Create & open my planner' : 'Log in'}</button>
          ${USE_DB ? `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
            <button type="button" class="back-link" style="margin:0" id="lgSwitch">${isNew ? 'Already have an account? Log in' : 'New here? Create account'}</button>
            ${isNew ? '' : '<button type="button" class="back-link" style="margin:0" id="lgForgot">Forgot password?</button>'}</div>` : ''}
        </div>
      </form>`);
    $('#lgBack').onclick = () => this.pick();
    $$('#login [data-peek]').forEach(b => b.onclick = () => { const i = $('#' + b.dataset.peek); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? 'Hide' : 'Show'; });
    const first = $(isNew ? '#lgName' : USE_DB ? '#lgEmail' : '#lgPw'); if (first) setTimeout(() => first.focus(), 30);
    const err = m => { const el = $('#lgErr'); el.textContent = m || ''; el.hidden = !m; if (m) $('#lgMsg').hidden = true; };
    const msg = m => { const el = $('#lgMsg'); el.textContent = m || ''; el.hidden = !m; if (m) $('#lgErr').hidden = true; };
    const busy = on => { const b = $('#lgSubmit'); if (b) { b.disabled = on; b.innerHTML = on ? '<span class="spinner"></span>' : (isNew ? 'Create &amp; open my planner' : 'Log in'); } };
    if (USE_DB) {
      $('#lgSwitch').onclick = () => this.form(role, isNew ? 'login' : 'new');
      const fg = $('#lgForgot');
      if (fg) fg.onclick = async () => {
        const email = $('#lgEmail').value.trim();
        if (!email) { err('Type your email above, then tap “Forgot password?” again.'); $('#lgEmail').focus(); return; }
        const { error } = await DbStore.sb.auth.resetPasswordForEmail(email, { redirectTo: DbAuth.redirect() });
        if (error) err(DbAuth.nice(error)); else msg('We emailed you a link to set a new password. Open it on this device.');
      };
    }
    $('#lgForm').onsubmit = async e => {
      e.preventDefault();
      const pw1 = $('#lgPw').value;
      if (isNew) {
        if (pw1.length < (USE_DB ? 6 : 4)) return err(`Use at least ${USE_DB ? 6 : 4} characters for your password.`);
        if (pw1 !== $('#lgPw2').value) return err('The two passwords don’t match.');
      }
      if (USE_DB) {
        const email = $('#lgEmail').value.trim();
        if (!/^\S+@\S+\.\S+$/.test(email)) return err('Enter a valid email address.');
        busy(true);
        try {
          if (isNew) {
            const { data, error } = await DbStore.sb.auth.signUp({ email, password: pw1, options: { data: { role, name: $('#lgName').value.trim() }, emailRedirectTo: DbAuth.redirect() } });
            if (error) throw error;
            if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('already registered');
            if (!data.session) { busy(false); this.recs[role] = { name: $('#lgName').value.trim() }; this.form(role, 'login'); $('#lgEmail').value = email; msg(`We sent a confirmation link to ${email}. Open it, then log in here.`); return; }
          } else {
            const { error } = await DbStore.sb.auth.signInWithPassword({ email, password: pw1 });
            if (error) throw error;
          }
          const prof = await DbAuth.profile();
          if (!prof) { await DbStore.sb.auth.signOut(); throw new Error('This account has no bride/groom profile. Create the account again from this screen.'); }
          if (prof.role !== role) { await DbStore.sb.auth.signOut(); busy(false); return err(`This email belongs to the ${PROFILES[prof.role] ? PROFILES[prof.role].label.toLowerCase() : 'other person'}. Go back and pick that card.`); }
          const { data: { user } } = await DbStore.sb.auth.getUser();
          startApp(role, { name: prof.name, user });
        } catch (ex) { busy(false); err(DbAuth.nice(ex)); }
        return;
      }
      if (isNew) {
        const existing = await Auth.get(role); // set up on another device in the meantime?
        if (existing) { this.recs[role] = existing; return this.form(role); }
        this.recs[role] = await Auth.create(role, $('#lgName').value, pw1);
      } else if (!Auth.check(rec, pw1)) { $('#lgPw').select(); return err('That password isn’t right. Try again.'); }
      Session.set(role, $('#lgRemember').checked);
      startApp(role);
    };
  }
};

function paintAccount() {
  if (!PROFILE) return;
  PROFILE.photo = state && state.settings.photo ? Images.src(state.settings.photo) : '';
  document.documentElement.dataset.profile = PROFILE.id;
  $$('.brand-name').forEach(el => { el.textContent = PROFILE.planner; });
  $('#accountTop').innerHTML = avatar(PROFILE);
  $('#accountTop').setAttribute('aria-label', 'Account: ' + (PROFILE.name || PROFILE.label));
  $('#accountSide').innerHTML = `${avatar(PROFILE)}<span><b>${esc(PROFILE.name || PROFILE.label)}</b><small>${PROFILE.label} · Account &amp; log out</small></span>`;
}
async function logout() {
  if (USE_DB) {
    await DbStore.flush();
    if (DbStore.dirty.size && !(await confirmDialog({ title: 'Some changes aren’t saved yet', message: 'The database couldn’t be reached, so your latest changes are only on this device. If you log out now they will be lost.', confirm: 'Log out anyway', danger: true }))) return;
    try { await DbStore.sb.auth.signOut(); } catch (e) {}
    // Your data lives in the database, so don't leave a copy on this device.
    try { localStorage.removeItem(APP_KEY + '.state'); Object.keys(localStorage).filter(k => k.startsWith(APP_KEY + '.img:')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  }
  Session.clear();
  location.replace(location.pathname + location.search);
}
function openAccount() {
  const email = USE_DB && DbStore.user ? DbStore.user.email : '';
  const s = openSheet({
    title: 'Account', narrow: true,
    body: `<div class="acct-head acct">${avatar(PROFILE)}<div><b style="font-size:17px">${esc(PROFILE.name || PROFILE.label)}</b><div class="muted small">${PROFILE.planner}${email ? ' · ' + esc(email) : ''}</div><div class="faint small">Only you can see this planner</div></div></div>
      <div class="acct-photo">
        <label class="btn btn-ghost btn-sm" for="acctFile">${icon('camera', 'sm')}${PROFILE.photo ? 'Change photo' : 'Add your photo'}</label>
        <input type="file" id="acctFile" accept="image/*">
        ${PROFILE.photo ? '<button type="button" class="btn btn-quiet btn-sm" id="acctPhotoRm">Remove photo</button>' : ''}
        <span class="hint" id="acctPhotoHint"></span>
      </div>
      <div class="divider"></div>
      <form id="pwForm" class="form-grid" novalidate>
        <div class="field"><label for="pwName">Your name</label><input class="input" id="pwName" value="${esc(PROFILE.name || '')}" autocomplete="given-name"></div>
        <div class="field"><label for="pwOld">Current password</label><input class="input" id="pwOld" type="password" autocomplete="current-password"><span class="hint">Needed to change your name or password.</span></div>
        <div class="field"><label for="pwNew">New password (optional)</label><input class="input" id="pwNew" type="password" autocomplete="new-password"></div>
        <div class="login-err" id="pwErr" role="alert" hidden></div>
        <button type="submit" class="btn btn-ghost">Save changes</button>
      </form>`,
    foot: `<button type="button" class="btn btn-danger" id="btnLogout">Log out</button>`
  });
  $('#btnLogout', s.el).onclick = () => logout();
  const setPhoto = async ref => {
    state.settings.photo = ref; commit(['settings']);
    if (!USE_DB) { // show it on this device's login screen too
      const rec = Auth.local(PROFILE.id);
      if (rec) { let thumb = ''; if (ref) { const j = await Images.asJpeg(ref, 200); thumb = j ? j.data : ''; } await Auth.put(PROFILE.id, { ...rec, photo: thumb }); }
    }
    s.close(); openAccount(); toast(ref ? 'Photo saved.' : 'Photo removed.');
  };
  $('#acctFile', s.el).addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    $('#acctPhotoHint', s.el).textContent = 'Saving photo…';
    try { await setPhoto(await Images.put(f)); } catch (ex) { $('#acctPhotoHint', s.el).textContent = ex.user ? ex.message : 'Couldn’t save the photo. Try again.'; }
  });
  const rm = $('#acctPhotoRm', s.el); if (rm) rm.onclick = () => setPhoto('');
  $('#pwForm', s.el).onsubmit = async e => {
    e.preventDefault();
    const err = m => { const el = $('#pwErr', s.el); el.textContent = m; el.hidden = !m; };
    const old = $('#pwOld', s.el).value, next = $('#pwNew', s.el).value, name = $('#pwName', s.el).value.trim();
    const min = USE_DB ? 6 : 4;
    if (next && next.length < min) return err(`Use at least ${min} characters for the new password.`);
    if (USE_DB) {
      try {
        const { error: e1 } = await DbStore.sb.auth.signInWithPassword({ email, password: old });
        if (e1) return err('Your current password isn’t right.');
        const { error: e2 } = await DbStore.sb.from('profiles').update({ name }).eq('user_id', DbStore.user.id);
        if (e2) throw e2;
        if (next) { const { error: e3 } = await DbStore.sb.auth.updateUser({ password: next }); if (e3) throw e3; }
      } catch (ex) { return err(DbAuth.nice(ex)); }
    } else {
      const rec = await Auth.get(PROFILE.id);
      if (!Auth.check(rec, old)) return err('Your current password isn’t right.');
      const updated = next ? { ...rec, name, salt: uid('s') } : { ...rec, name };
      if (next) updated.hash = hashPassword(next, updated.salt);
      await Auth.put(PROFILE.id, updated);
    }
    PROFILE.name = name; paintAccount(); render(); s.close();
    toast(next ? 'Password changed.' : 'Saved.');
  };
}
/* Opened after someone follows a "reset password" email link. */
function openNewPasswordSheet() {
  const s = openSheet({
    title: 'Set a new password', narrow: true,
    body: `<form id="npForm" class="form-grid" novalidate><div class="field"><label for="npPw">New password</label><input class="input" id="npPw" type="password" autocomplete="new-password"></div><div class="login-err" id="npErr" hidden></div></form>`,
    foot: `<button type="button" class="btn btn-ghost" data-close>Later</button><button type="button" class="btn btn-primary" id="npSave">Save password</button>`
  });
  const save = async () => {
    const v = $('#npPw', s.el).value, el = $('#npErr', s.el);
    if (v.length < 6) { el.textContent = 'Use at least 6 characters.'; el.hidden = false; return; }
    const { error } = await DbStore.sb.auth.updateUser({ password: v });
    if (error) { el.textContent = DbAuth.nice(error); el.hidden = false; return; }
    s.close(); toast('New password saved.');
  };
  $('#npSave', s.el).onclick = save;
  $('#npForm', s.el).onsubmit = e => { e.preventDefault(); save(); };
}
ACTIONS.account = () => openAccount();

/* ---------- N. BOOT ---------- */
let pendingRecovery = false;
async function startApp(role, opts = {}) {
  let name = opts.name;
  if (name === undefined) { const rec = Auth.local(role) || await Auth.get(role); name = rec && rec.name || ''; }
  PROFILE = { ...PROFILES[role], name: name || '' };
  APP_KEY = 'wbp.v1.' + role;
  const loaded = LocalStore.load();
  state = normalizeState(loaded || emptyState()); // each person starts with a clean planner
  if (!loaded) LocalStore.save(state);
  $('#login').hidden = true; $('#login').innerHTML = '';
  $('#app').hidden = false; $('#bottomNav').hidden = false;
  paintAccount();
  render();
  setSync(LocalStore.ok ? 'local' : 'memory');
  capability('downloads').then(d => { Downloads.api = d; });
  if (USE_DB) {
    DbStore.user = opts.user;
    DbStore.pull();
    if (pendingRecovery) { pendingRecovery = false; openNewPasswordSheet(); }
  } else {
    capability('assets').then(a => { Images.assets = a; });
    CloudStore.init();
  }
}
function seedDemo() {
  try {
    const fresh = localStorage.getItem('wbp.demo') !== '2'; // re-seed once when the demo data changes
    Object.keys(PROFILES).forEach(role => {
      if (Auth.local(role) && !fresh) return;
      const salt = uid('s');
      localStorage.setItem(Auth.key(role), JSON.stringify({ name: DEMO_NAMES[role], salt, hash: hashPassword(DEMO_PASSWORDS[role], salt), photo: DEMO_ASSETS[role] || '', createdAt: Date.now() }));
      const st = normalizeState(sampleFor(role));
      st.settings.photo = DEMO_ASSETS[role] || '';
      st.settings.wedding.invite = DEMO_ASSETS.invite || '';
      localStorage.setItem('wbp.v1.' + role + '.state', JSON.stringify(st));
    });
    localStorage.setItem('wbp.demo', '2');
  } catch (e) { /* storage blocked: the login screen still lets you create accounts */ }
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Failed to fetch')); document.head.appendChild(s); });
}
(async function boot() {
  $$('[data-icon="rings"]').forEach(el => { el.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.rings}</svg>`; });
  if (!USE_DB) {
    if (DEMO) seedDemo();
    const role = Session.get();
    if (role && Auth.local(role)) startApp(role); else { Session.clear(); Login.show(); }
    return;
  }
  try {
    if (!window.supabase) await loadScript(SUPABASE_JS);
    DbStore.sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    Login.loadErr = 'Couldn’t load the database. Check your internet connection and reload.'; Login.show(); return;
  }
  DbStore.sb.auth.onAuthStateChange(event => {
    if (event === 'PASSWORD_RECOVERY') { if (PROFILE) openNewPasswordSheet(); else pendingRecovery = true; }
  });
  try {
    const { data: { session } } = await DbStore.sb.auth.getSession();
    if (session) {
      const prof = await DbAuth.profile();
      if (prof && PROFILES[prof.role]) return startApp(prof.role, { name: prof.name, user: session.user });
    }
  } catch (e) { /* fall through to the login screen */ }
  Login.show();
})();
